name: PulseChat CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulsechat
          POSTGRES_PASSWORD: pulsechat_local
          POSTGRES_DB: pulsechat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulsechat -d pulsechat_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/setup-env.js
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl --fail http://localhost:8080
      - run: docker compose exec -T backend node -e "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1))"
      - if: always()
        run: docker compose logs --tail=80
      - if: always()
        run: docker compose down -v
